# Veyra 后端入口 —— 由 .github/workflows/deploy.yml 同步到 /etc/nginx/conf.d/veyra.conf
#
# 后端进程：pm2 veyra-backend，只听 127.0.0.1:8890（/opt/veyra/ecosystem.config.js）
#
# 两个口子：
#   8888 —— 应用端（Android 手机 / TV）API。公开，自带 Bearer token 认证。
#            /api/admin/、/api/debug/ 与 WebUI 在这里一律 404，只能从 8088 进。
#   8088 —— 管理员控制台（WebUI + 全部 /api/）。
#            走 Veyra 自己的管理员登录：POST /api/admin/login 用 ADMIN_PASSWORD 换
#            8 小时会话 token，其余 /api/admin/* 由后端的 requireAdmin 守卫。
#            这里不接 account-api / OAuth —— 管理台只认这一个密码。

# 登录限速：管理台密码是唯一凭据，挡一下在线爆破（同 IP 每分钟 10 次，允许 5 次突发）
limit_req_zone $binary_remote_addr zone=veyra_admin_login:10m rate=10r/m;

upstream veyra_backend {
    server 127.0.0.1:8890;
}

# ---- 8088：管理员控制台（后端自带管理员登录）----
server {
    listen 8088;
    server_name _;

    client_max_body_size 64m;

    location = /api/admin/login {
        limit_req zone=veyra_admin_login burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://veyra_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://veyra_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 下载任务轮询 / 合并 / APK 缓存下载都可能跑很久
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}

# ---- 8888：应用端 API（手机 / TV）----
server {
    listen 8888;
    server_name _;

    client_max_body_size 64m;

    # 管理台与调试接口只从 8088 进
    location ^~ /api/admin/ { return 404; }
    location ^~ /api/debug/ { return 404; }

    # 注意：/api/huangguo-proxy 不封。客户端已默认仅直连，但已装机的旧 APK
    # （通道存的是 3「走后端转发」）还会打这个端点；新包发出去、装机版本跟上来之前
    # 先留着，避免现网手机直接白屏。等 APK 铺开后再回来封这一个 location。

    location /api/ {
        proxy_pass http://veyra_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # WebUI 页面与 HLS 脚本不在公网口暴露
    location / { return 404; }
}
