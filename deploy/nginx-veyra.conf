# Veyra 后端入口 —— 由 .github/workflows/deploy.yml 同步到 /etc/nginx/conf.d/veyra.conf
#
# 后端进程：pm2 veyra-backend，只听 127.0.0.1:8890（/opt/veyra/ecosystem.config.js）
#
# 两个口子：
#   8888 —— 应用端（Android 手机 / TV）API。公开，自带 Bearer token 认证。
#            /api/admin/、/api/debug/ 与 WebUI 在这里一律 404，只能从 8088 进，
#            避免绕过账号网关直接打管理员接口。
#   8088 —— 管理员控制台（WebUI + 全部 /api/）。挂 muyaya account-api 网关：
#            auth_request 子请求 /auth/admin-check，只有白名单里的站长账号能过；
#            没登录跳相册站登录页，登录了但不在白名单 403。
#            网关放行后给上游带 X-Veyra-Gate（密钥在 /opt/veyra/gate.secret，
#            由部署流程生成、与后端共享），后端据此免掉二次的 ADMIN_PASSWORD 登录。
#            8888 口绝不注入这个头。

upstream veyra_backend {
    server 127.0.0.1:8890;
}

# ---- 8088：管理员控制台（账号网关）----
server {
    listen 8088;
    server_name _;

    client_max_body_size 64m;

    # 相册站登录页（与 dsh-8084 同一个口子，登录态按 host 共享，跨端口通用）
    set $veyra_login "http://120.48.86.101:8083/login.html";

    # 网关放行密钥（set $veyra_gate_secret "…"），部署流程生成，不进仓库
    include /etc/nginx/snippets/veyra-gate.conf;

    # 网关子请求：必须 HTTP/1.1，默认 1.0 会让 account-api 回 400（nginx 只认 2xx/401/403）
    location = /__veyra_gate {
        internal;
        proxy_http_version 1.1;
        proxy_pass http://muyaya_account/auth/admin-check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $http_host;
    }

    location @veyra_needlogin {
        return 302 $veyra_login;
    }

    location @veyra_denied {
        default_type text/plain;
        return 403 "这个页面只有站长本人能打开。\n";
    }

    location / {
        auth_request /__veyra_gate;
        error_page 401 = @veyra_needlogin;
        error_page 403 = @veyra_denied;

        # 网关已验在白名单里 → 告诉后端「这人就是管理员」，WebUI 免二次登录
        proxy_set_header X-Veyra-Gate $veyra_gate_secret;

        proxy_pass http://veyra_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 下载任务轮询 / 合并 / APK 缓存下载都可能跑很久
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}

# ---- 8888：应用端 API（手机 / TV）----
server {
    listen 8888;
    server_name _;

    client_max_body_size 64m;

    # 管理台与调试接口只从 8088 进
    location ^~ /api/admin/ { return 404; }
    location ^~ /api/debug/ { return 404; }

    # 注意：/api/huangguo-proxy 不封。客户端已默认仅直连，但已装机的旧 APK
    # （通道存的是 3「走后端转发」）还会打这个端点；新包发出去、装机版本跟上来之前
    # 先留着，避免现网手机直接白屏。等 APK 铺开后再回来封这一个 location。

    location /api/ {
        proxy_pass http://veyra_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # WebUI 页面与 HLS 脚本不在公网口暴露
    location / { return 404; }
}
