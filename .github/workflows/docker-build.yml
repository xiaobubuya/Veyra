name: Build & Push Docker Image

# 注意：本 fork 没有配置 DOCKERHUB_USERNAME / DOCKERHUB_TOKEN，push 自动触发每次都会红在
# 「Login to Docker Hub」。后端现在是本机 self-hosted runner 部署（deploy.yml），
# 镜像只在需要给 NAS 用时手动跑这个 workflow。

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/veyra-backend:latest
          # 层缓存：base/apk/ffmpeg 等不常变层复用，NAS 增量拉取，避免每次全量 113MB
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/veyra-backend:cache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/veyra-backend:cache,mode=max
