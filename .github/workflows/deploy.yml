name: Deploy Backend

# 后端部署：本机 self-hosted runner → 拉 server/ → pm2 重启 → 健康检查。
# 不做 Docker：这台机器没装 docker；容器镜像那套由 docker-build.yml 负责（手动跑，给 NAS 用）。
#
# 为什么不用 actions/checkout：
#   仓库 46MB（APK 测试素材 + ffmpeg jar），本机到 github.com 的 git 传输只有 1~8KB/s，
#   sparse checkout 也要几十分钟。deploy/sync-server.py 改成按 Git tree 逐文件走
#   jsDelivr / api.github.com 取内容（实测 100~120KB/s），并且按 git blob sha1 跳过未变文件。
#
# 前置（一次性，机器上）：
#   /opt/veyra/ecosystem.config.js   pm2 进程定义（PORT=8890 / HOST=127.0.0.1 / DATA_DIR=/opt/veyra/data）
#   /etc/nginx/conf.d/veyra.conf     由本 workflow 从这里同步（8888 应用 API + 8088 管理员控制台）
#   端口约定：后端只听 127.0.0.1:8890，公网由 nginx 那层转。

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'deploy/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: veyra-deploy
  cancel-in-progress: false

env:
  DEST: /opt/veyra/server
  DEST_NGINX: /etc/nginx/conf.d/veyra.conf

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: 取部署脚本
        run: |
          set -euo pipefail
          URL_CDN="https://cdn.jsdelivr.net/gh/${{ github.repository }}@${{ github.sha }}/deploy/sync-server.py"
          URL_API="https://api.github.com/repos/${{ github.repository }}/contents/deploy/sync-server.py?ref=${{ github.sha }}"
          if curl -fsSL --max-time 60 "$URL_CDN" -o /tmp/sync-server.py && [ -s /tmp/sync-server.py ]; then
            echo "从 jsDelivr 取到部署脚本"
          else
            echo "jsDelivr 不可用，改走 api.github.com"
            curl -fsSL --max-time 90 \
                 -H "Authorization: Bearer ${{ github.token }}" \
                 -H "Accept: application/vnd.github.raw" \
                 "$URL_API" -o /tmp/sync-server.py
          fi
          head -n 3 /tmp/sync-server.py

      - name: 同步 server/ 到 /opt/veyra/server
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EXTRA_PATHS: deploy/nginx-veyra.conf
        run: python3 /tmp/sync-server.py

      - name: 安装生产依赖
        run: |
          set -euo pipefail
          export PATH="/usr/local/bin:$PATH"
          cd "$DEST"
          # 本机到 npmjs 慢，走国内镜像
          npm config set registry https://registry.npmmirror.com
          npm ci --omit=dev --no-audit --no-fund

      - name: 同步 nginx 站点配置（变了才 reload）
        run: |
          set -euo pipefail
          SRC="$DEST/_extra/nginx-veyra.conf"
          test -f "$SRC" || { echo "没拿到 nginx 配置：$SRC" >&2; exit 1; }
          if [ -f "$DEST_NGINX" ] && cmp -s "$SRC" "$DEST_NGINX"; then
            echo "nginx 配置未变，跳过"
            exit 0
          fi
          cp -a "$DEST_NGINX" "$DEST_NGINX.bak" 2>/dev/null || true
          install -m 600 "$SRC" "$DEST_NGINX"
          if ! nginx -t; then
            echo "nginx 配置校验失败，回滚" >&2
            [ -f "$DEST_NGINX.bak" ] && mv -f "$DEST_NGINX.bak" "$DEST_NGINX"
            exit 1
          fi
          systemctl reload nginx
          echo "nginx 已 reload"

      - name: 重启后端（pm2）
        run: |
          set -euo pipefail
          export PATH="/usr/local/bin:$PATH"
          if pm2 describe veyra-backend >/dev/null 2>&1; then
            pm2 restart veyra-backend --update-env
          else
            pm2 start /opt/veyra/ecosystem.config.js --only veyra-backend
          fi
          pm2 save

      - name: 健康检查
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -fsS --max-time 3 http://127.0.0.1:8890/api/health >/dev/null; then
              echo "后端健康检查通过"
              # 顺带确认网关两个口子的行为没被改坏
              api=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:8888/api/health)
              blocked=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:8888/api/admin/settings)
              console=$(curl -s -o /dev/null -w '%{http_code}' --max-time 8 http://127.0.0.1:8088/)
              admin=$(curl -s -o /dev/null -w '%{http_code}' --max-time 8 http://127.0.0.1:8088/api/admin/settings)
              echo "8888/api/health=$api  8888/api/admin/settings=$blocked  8088/=$console  8088/api/admin/settings(未登录)=$admin"
              # 8088 首页给 WebUI（200），管理接口未登录必须 401（后端 requireAdmin 拦）
              [ "$api" = "200" ] && [ "$blocked" = "404" ] && [ "$console" = "200" ] && [ "$admin" = "401" ]
              exit 0
            fi
            sleep 1
          done
          echo "后端 30 秒内没起来，日志尾巴：" >&2
          tail -n 50 /root/.pm2/logs/veyra-backend-error.log >&2 || true
          tail -n 50 /root/.pm2/logs/veyra-backend-out.log >&2 || true
          exit 1
